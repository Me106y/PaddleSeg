batch_size: 4
iters: 50000

train_dataset:
  type: Dataset
  mode: train
  dataset_root: data/portrait16k/data
  train_path: data/portrait16k/data/train.txt
  num_classes: 2
  transforms:
    - type: Resize
      target_size: [256, 144]
    - type: ResizeStepScaling
      scale_step_size: 0
    - type: RandomRotation
    - type: RandomPaddingCrop
      crop_size: [256, 144]
    - type: RandomHorizontalFlip
    - type: RandomDistort
    - type: RandomBlur
      prob: 0.3
    - type: Normalize

val_dataset:
  type: Dataset
  mode: val
  dataset_root: data/portrait16k/data
  val_path: data/portrait16k/data/val.txt
  num_classes: 2
  transforms:
    - type: Resize
      target_size: [256, 144]
    - type: Normalize


optimizer:
  type: SGD
  momentum: 0.9
  weight_decay: 4.0e-5

lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.01
  end_lr: 0
  power: 0.9

loss:
  types:
    - type: CrossEntropyLoss
  coef: [1]

loss:
  types:
    - type: CrossEntropyLoss
  coef: [1, 0.4]

model:
  type: PSPNet
  backbone:
    type: ResNet50_vd
    output_stride: 8
  enable_auxiliary_loss: True
  align_corners: False
  pretrained: null
